# Merge with the existing VPS HTTPS proxy. Supply its certificate paths.
# Do not expose :3100 publicly. Always overwrite the IP header.
server {
    listen 443 ssl;
    server_name DEMO_DOMAIN;
    ssl_certificate /REPLACE/fullchain.pem;
    ssl_certificate_key /REPLACE/privkey.pem;
    client_max_body_size 32k;
    large_client_header_buffers 4 32k;
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Resvary-Client-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_hide_header X-Powered-By;
    }
}
