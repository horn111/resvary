name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: SDK Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Build persistence packages
        run: npm run build:core

      - name: Type check
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Smoke test package exports and CLIs
        run: npm run test:exports

      - name: Build generated SQLite and Postgres starters
        run: npm run test:starters

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run workspace tests
        run: npm test

  console-e2e:
    name: Operator Console browser tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Operator Console
        run: npm run build --workspace=@resvary/console

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e --workspace=@resvary/console

  console-image-smoke:
    name: Operator Console image smoke and scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build Operator Console image
        run: docker build --tag resvary-console:ci --file apps/console/Dockerfile .

      - name: Smoke test authenticated health and read-only demo mode
        env:
          SMOKE_SECRET: ci-smoke-secret-with-at-least-32-characters
        run: |
          docker run --detach --name resvary-console-ci --publish 3011:3000 \
            --env RESVARY_PROJECT_ID=project_demo \
            --env RESVARY_CONSOLE_ADMIN_SECRET="$SMOKE_SECRET" \
            --env RESVARY_CONSOLE_DEMO_MODE=true \
            resvary-console:ci
          trap 'docker logs resvary-console-ci; docker rm --force resvary-console-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              --header "Authorization: Bearer $SMOKE_SECRET" \
              http://127.0.0.1:3011/api/health | grep --quiet '"ok":true'; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Scan Operator Console image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: resvary-console:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  sqlite:
    name: SQLite durability
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build persistence packages
        run: npm run build:core

      - name: Run SQLite tests
        run: npm run test --workspace=@resvary/sqlite

      - name: Generate fixed 10k customer / 1m activity profile
        run: node scripts/generate-admin-load.mjs

      - name: Enforce Operator Console query budgets
        run: node scripts/benchmark-admin.mjs --samples 100

  postgres:
    name: Postgres concurrency and migrations
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        postgres-version: [16, 17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resvary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d resvary_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/resvary_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build persistence packages
        run: npm run build:core

      - name: Run Postgres integration tests
        run: npm run test --workspace=@resvary/postgres

      - name: Run outbox worker tests
        run: npm run test --workspace=@resvary/worker
