name: Operator Console image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish (for example, 1.0.0-rc.1 or 1.0.0)
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/resvary-console
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=rc,enable=${{ contains(inputs.version, '-rc.') }}
            type=raw,value=latest,enable=${{ !contains(inputs.version, '-') }}

      - name: Build and publish multi-architecture image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/console/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Scan immutable image digest
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/resvary-console@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload scan report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Record immutable digest
        run: |
          echo "Published digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
