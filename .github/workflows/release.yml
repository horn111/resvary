name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Release phase
        required: true
        default: dry_run
        type: choice
        options: [dry_run, publish]
      version:
        description: Stable version to release (for example, 0.7.0)
        required: true
        type: string
      release_sha:
        description: Full main commit SHA to release
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    name: Preflight and immutable artifacts
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      RELEASE_MODE: ${{ inputs.mode }}

    steps:
      - name: Require main workflow ref
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main

      - name: Checkout release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require release commit on main
        run: |
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Pin npm CLI
        run: npm install --global npm@11.19.1

      - name: Validate release metadata and successful CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/validate.mjs "${{ inputs.version }}"

      - name: Clean install
        run: npm ci

      - name: Audit dependencies and signatures
        run: |
          npm audit --audit-level=high
          npm audit signatures

      - name: Run release gates
        run: |
          npm run format:check
          npm run design:check
          npm run typecheck
          npm run build
          npm test
          npm run test:exports
          npm run test:starters

      - name: Pack and inspect release archives
        env:
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/release-artifacts
        run: node scripts/release/artifacts.mjs pack "${{ inputs.version }}"

      - name: Install checked archives outside the monorepo
        env:
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/release-artifacts
        run: node scripts/release/artifacts.mjs smoke "${{ inputs.version }}"

      - name: Upload checked release archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ inputs.version }}-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/release-artifacts
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish checked packages with npm OIDC and finalize release
    if: ${{ inputs.mode == 'publish' }}
    needs: preflight
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Pin npm CLI
        run: npm install --global npm@11.19.1

      - name: Download checked release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-${{ inputs.version }}-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/release-artifacts

      - name: Publish dependency levels with provenance
        env:
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/release-artifacts
        run: node scripts/release/registry.mjs publish "${{ inputs.version }}"

      - name: Verify registry metadata, provenance, installs, CLIs, and starters
        run: node scripts/release/registry.mjs finalize "${{ inputs.version }}"

      - name: Create annotated tag and stable GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/registry.mjs github-release "${{ inputs.version }}"
