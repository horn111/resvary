name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Release phase
        required: true
        default: dry_run
        type: choice
        options: [dry_run, publish]
      version:
        description: Version to release (for example, 1.0.0-rc.1 or 1.0.0)
        required: true
        type: string
      release_sha:
        description: Full main commit SHA to release
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    name: Preflight and immutable artifacts
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      RELEASE_MODE: ${{ inputs.mode }}

    steps:
      - name: Require main workflow ref
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main

      - name: Checkout release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require release commit on main
        run: |
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Pin npm CLI
        run: npm install --global npm@11.19.1

      - name: Validate release metadata and successful CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/validate.mjs "${{ inputs.version }}"

      - name: Clean install
        run: npm ci

      - name: Audit dependencies and signatures
        run: |
          npm audit --audit-level=high
          npm audit signatures

      - name: Run release gates
        run: |
          npm run format:check
          npm run design:check
          npm run typecheck
          npm run build
          npm test
          npm run test:exports
          npm run test:starters

      - name: Install Chromium for Operator Console tests
        run: npx playwright install --with-deps chromium

      - name: Run Operator Console browser tests
        run: npm run test:e2e --workspace=@resvary/console

      - name: Generate fixed Operator Console load profile
        run: node scripts/generate-admin-load.mjs

      - name: Enforce Operator Console query budgets
        run: node scripts/benchmark-admin.mjs --samples 100

      - name: Build Operator Console smoke image
        run: docker build --tag resvary-console:release-candidate --file apps/console/Dockerfile .

      - name: Smoke test Operator Console image
        env:
          SMOKE_SECRET: release-smoke-secret-with-at-least-32-characters
        run: |
          docker run --detach --name resvary-console-smoke --publish 3011:3000 \
            --env RESVARY_PROJECT_ID=project_demo \
            --env RESVARY_CONSOLE_ADMIN_SECRET="$SMOKE_SECRET" \
            --env RESVARY_CONSOLE_DEMO_MODE=true \
            resvary-console:release-candidate
          trap 'docker logs resvary-console-smoke; docker rm --force resvary-console-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              --header "Authorization: Bearer $SMOKE_SECRET" \
              http://127.0.0.1:3011/api/health | grep --quiet '"ok":true'; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Scan Operator Console candidate image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: resvary-console:release-candidate
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Pack and inspect release archives
        env:
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/release-artifacts
        run: node scripts/release/artifacts.mjs pack "${{ inputs.version }}"

      - name: Install checked archives outside the monorepo
        env:
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/release-artifacts
        run: node scripts/release/artifacts.mjs smoke "${{ inputs.version }}"

      - name: Upload checked release archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ inputs.version }}-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/release-artifacts
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish checked packages with npm OIDC and finalize release
    if: ${{ inputs.mode == 'publish' }}
    needs: preflight
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: write
      actions: read
      id-token: write
      packages: write
      security-events: write
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Pin npm CLI
        run: npm install --global npm@11.19.1

      - name: Download checked release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-${{ inputs.version }}-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/release-artifacts

      - name: Publish dependency levels with provenance
        env:
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/release-artifacts
        run: node scripts/release/registry.mjs publish "${{ inputs.version }}"

      - name: Verify registry metadata, provenance, installs, CLIs, and starters
        run: node scripts/release/registry.mjs finalize "${{ inputs.version }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive Operator Console image tags
        id: console-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/resvary-console
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=rc,enable=${{ contains(inputs.version, '-rc.') }}
            type=raw,value=latest,enable=${{ !contains(inputs.version, '-') }}

      - name: Publish multi-architecture Operator Console image
        id: console-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/console/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.console-meta.outputs.tags }}
          labels: ${{ steps.console-meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Scan immutable Operator Console image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/resvary-console@${{ steps.console-image.outputs.digest }}
          format: sarif
          output: trivy-console.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Operator Console scan report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-console.sarif

      - name: Record immutable Operator Console digest
        run: echo "Published digest: ${{ steps.console-image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Create annotated tag and GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/registry.mjs github-release "${{ inputs.version }}"
